[versions]
# Pinned to games/uno and games/satti so the library and both games upgrade together.
kotlin = "2.2.20"
agp = "8.9.3"
coroutines = "1.10.1"
serialization = "1.8.0"
ktor = "3.1.0"
# Discovery (owner pick 2026-11-03): Android NSD, iOS Bonjour, JVM JmDNS. Built with Kotlin 2.3.20: fine on
# Android with our 2.2.20, but its iOS klib needs a 2.3 compiler (1.0.4 is the last 2.1 build). Decide by week 3.
dnssd = "1.1.2"
# End-to-end encryption (owner, 2026-11-03). 0.5.0 is built with Kotlin 2.2.0 (0.6.0 needs 2.3 for the iOS klib).
cryptography = "0.5.0"
# Only to run dns-sd-kt's context initializer on first use (it is removed from app start).
androidx-startup = "1.2.0"
# dns-sd-kt uses only ContextCompat from androidx; it used to arrive through appcompat, which we exclude.
androidx-core = "1.13.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
dns-sd = { module = "com.appstractive:dns-sd-kt", version.ref = "dnssd" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-websockets = { module = "io.ktor:ktor-client-websockets", version.ref = "ktor" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
cryptography-core = { module = "dev.whyoleg.cryptography:cryptography-core", version.ref = "cryptography" }
cryptography-provider-jdk = { module = "dev.whyoleg.cryptography:cryptography-provider-jdk", version.ref = "cryptography" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "androidx-startup" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
